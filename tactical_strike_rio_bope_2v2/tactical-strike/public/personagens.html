<header><p>TACTICAL STRIKE / PERSONAGENS DO CS 1.6</p><h1>ESQUADRÃO BOPE</h1><p>Modelos enviados · GIGN / GSG9 / SAS / URBAN</p></header><div class="names" id="names"></div><footer><button id="animate">Pausar caminhada</button><a href="/">Voltar ao jogo</a></footer>

<script type="module">
import * as THREE from 'three';import {createOperator,animateOperator,OPERATORS,loadOperators} from './characters.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101820);const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);camera.position.set(0,2.6,9.5);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.5;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f2ff,0x46505b,2));const key=new THREE.DirectionalLight(0xffe4c4,4);key.position.set(-3,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);const rim=new THREE.DirectionalLight(0x80cfff,3);rim.position.set(4,3,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x18252e,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
await loadOperators();
const models=OPERATORS.map((p,i)=>{const m=createOperator(i);m.position.x=(i-1.5)*1.45;m.rotation.y=-.23;scene.add(m);const label=document.createElement('div');label.innerHTML='<strong>'+p.name.toUpperCase()+'</strong><small>'+p.role+'</small>';document.getElementById('names').append(label);return m;});
let running=true;document.getElementById('animate').onclick=e=>{running=!running;e.target.textContent=running?'Pausar caminhada':'Animar caminhada';};const clock=new THREE.Clock();function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.04);models.forEach(m=>animateOperator(m,dt,running?1.1:0));renderer.render(scene,camera);}tick();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
window.showcase={models,renderer};
</script></html>
